ReleaseNotes: |-
  Initial preview release.
  - 16 optimization modules (clean, memory, CPU, repair, GPU, security, privacy...)
  - Optional RealtimeGuard background service (off by default in the installer)
  - WPF Fluent Dark dashboard + command line interface
  - The installer bundles the .NET runtime: no prerequisites on the target PC
  Known limitations:
  - The installer is NOT code-signed; SmartScreen will warn on first run.
    Verify the published SHA256 before installing.
  - The user interface is currently Turkish-first; English localization is partial.
