name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Source Link için tam geçmiş

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinOptimizer.sln

      # Biçim kapısı — .editorconfig kurallarına uymayan kod derlemeden önce yakalanır
      # (master plan Bölüm 18.3). Roslyn analiz kapısı Directory.Build.props'ta
      # (AnalysisLevel=latest-recommended + TreatWarningsAsErrors) zorlanır.
      - name: Verify formatting
        run: dotnet format WinOptimizer.sln --verify-no-changes --verbosity minimal

      - name: Build
        # TreatWarningsAsErrors açık; sıfır uyarı hedefi (master plan Bölüm 8.6)
        run: dotnet build WinOptimizer.sln -c Release --no-restore

      - name: Test
        run: dotnet test WinOptimizer.sln -c Release --no-build --verbosity normal

      # --- Paketleme (master plan Bölüm 20) ---
      # Cozumun tamami publish EDILMEZ: `dotnet publish <sln>` test projelerini de ayni
      # klasore koyar ve xunit/Moq/FluentAssertions/testhost ikilileri MSI ile son
      # kullaniciya gonderilir. Yalnizca dagitilacak uc proje yayinlanir.
      - name: Publish (App + Service + CLI)
        run: |
          dotnet publish src\WinOptimizer.App\WinOptimizer.App.csproj -c Release -o publish -p:PublishSingleFile=false
          dotnet publish src\WinOptimizer.Service\WinOptimizer.Service.csproj -c Release -o publish -p:PublishSingleFile=false
          dotnet publish src\WinOptimizer.Cli\WinOptimizer.Cli.csproj -c Release -o publish -p:PublishSingleFile=false

      - name: Setup WiX v4
        run: dotnet tool install --global wix

      - name: Generate Payload.wxs
        run: .\build\generate-payload.ps1 -PublishDir publish -OutputFile installer\wix\Payload.wxs
        shell: pwsh

      # EULA ekrani icin license.rtf, docs\EULA.md'den uretilir (commit edilmez).
      - name: Generate license.rtf
        run: .\build\generate-license.ps1
        shell: pwsh

      - name: Build MSI
        working-directory: installer/wix
        run: dotnet build WinOptimizer.wixproj -c Release -p:PublishSourceDir=${{ github.workspace }}\publish

      # İmzalama — yalnızca sertifika gizli değişkenleri tanımlıysa (Bölüm 20.4).
      - name: Sign binaries & MSI
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          .\build\sign-release.ps1 -PublishDir publish -PfxPath $pfx -PfxPassword $env:SIGN_PFX_PASSWORD
          .\build\sign-release.ps1 -PublishDir installer\wix\bin -PfxPath $pfx -PfxPassword $env:SIGN_PFX_PASSWORD

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-msi
          path: installer/wix/bin/*.msi
          if-no-files-found: error

  # --- Sürüm (tag) yayını: GitHub Release + Winget PR (Bölüm 20.5) ---
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: WinOptimizer-msi
          path: release

      - name: Compute SHA256
        id: sha
        working-directory: release
        run: echo "sha256=$((Get-FileHash *.msi -Algorithm SHA256).Hash)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.msi
          generate_release_notes: true

      # Winget manifest PR — gerçek repo (winget-pkgs) ekip üyesi tarafından yapılır.
      # Burada yalnızca SHA256 manifest'i güncellenmiş bir kopya artifact olarak sunulur.
      - name: Prepare Winget manifest (SHA256 patch)
        working-directory: installer/winget
        run: |
          (Get-Content WinOptimizer.WinOptimizer.installer.yaml) `
            -replace '(?<=InstallerSha256:\s)[0-9A-Fa-f]{64}', '${{ steps.sha.outputs.sha256 }}' `
            | Set-Content WinOptimizer.WinOptimizer.installer.yaml
          Get-Content WinOptimizer.WinOptimizer.installer.yaml

      - name: Upload Winget manifest
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: installer/winget/*.yaml
