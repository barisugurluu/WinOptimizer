name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  # Etiket atmadan kurulum üretebilmek için (Actions → build → Run workflow).
  workflow_dispatch:

# Aynı dal/etiket için yeni bir push geldiğinde eskisini iptal et: 60 sn'lik
# LZMA2/ultra64 sıkıştırması yüzünden bu iş akışı pahalıdır.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # windows-latest'e sabitlenmedi: runner imajı sürüm atladığında (VS/SDK değişimi)
    # TreatWarningsAsErrors yüzünden derleme habersiz kırılabilir.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Source Link için tam geçmiş

      # global.json (8.0.400, rollForward=latestFeature) sürümü belirler.
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WinOptimizer.sln

      # Biçim kapısı — .editorconfig kurallarına uymayan kod derlemeden önce yakalanır
      # (master plan Bölüm 18.3). DİKKAT: LF satır sonlu tek bir yeni dosya bile bu
      # adımı düşürür (.editorconfig: end_of_line = crlf). Roslyn analiz kapısı
      # Directory.Build.props'ta (AnalysisLevel + TreatWarningsAsErrors) zorlanır.
      - name: Verify formatting
        run: dotnet format WinOptimizer.sln --verify-no-changes --verbosity minimal

      - name: Build
        # TreatWarningsAsErrors açık; sıfır uyarı hedefi (master plan Bölüm 8.6)
        run: dotnet build WinOptimizer.sln -c Release --no-restore

      - name: Test (with coverage)
        run: dotnet test WinOptimizer.sln -c Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory:${{ github.workspace }}/coverage

      - name: Publish coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/**/*.cobertura.xml

      # --- Paketleme: TEK hat, build/build-installer.ps1 ---
      # Publish + sağlık kontrolü + license.rtf + ISCC + SHA256 adımlarının tamamı
      # betiğin içindedir; CI ile yerel derleme arasında sürüklenme olamaz.
      # Testler yukarıda kapsam toplayarak koştuğu için burada -SkipTests.
      #
      # KOD İMZALAMA ADIMI YOKTUR — bilinçli karar (docs/KURULUM.md). Buraya canlı bir
      # imzalama adımı eklemeyin: kendinden imzalı bir sertifikanın release'e sızma yolu
      # tam olarak budur ve hedef PC'de "geçersiz imza" imzasızdan daha kötüdür.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: .\build\build-installer.ps1 -SkipTests
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WinOptimizer-setup
          path: |
            installer/build/*-setup.exe
            installer/build/*-setup.exe.sha256
          if-no-files-found: error

  # --- Sürüm (tag) yayını: GitHub Release + Winget manifest yaması ---
  release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: WinOptimizer-setup
          path: release

      # Hash'i yeniden hesaplamak yerine build işinin ürettiği yan dosyayla DOĞRULA:
      # böylece artifact aktarımı sırasında bozulma sessizce release'e geçmez.
      - name: Verify SHA256 sidecar
        id: sha
        working-directory: release
        shell: pwsh
        run: |
          $setup = Get-ChildItem *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw 'Kurulum dosyasi artifact icinde yok.' }
          $sidecar = Get-Content "$($setup.Name).sha256" -Raw
          $expected = ($sidecar -split '\s+')[0].Trim()
          $actual = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash
          if ($expected -ne $actual) {
            throw "SHA256 uyusmuyor. Beklenen=$expected Gercek=$actual"
          }
          Write-Host "SHA256 dogrulandi: $actual"
          "sha256=$actual" >> $env:GITHUB_OUTPUT
          "setupName=$($setup.Name)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          # Ön sürüm etiketleri (v0.1.0-alpha gibi) pre-release olarak yayınlanır.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Kurulum

            `${{ steps.sha.outputs.setupName }}` dosyasını indirin ve çalıştırın.
            Hedef PC'de **.NET kurulu olması gerekmez** — runtime kurulumun içinde gömülüdür.

            ### ⚠ SmartScreen uyarısı normaldir

            Kurulum **kod imzalı değildir**. Windows "Bilgisayarınız korundu" uyarısı
            gösterebilir:

            1. **Daha fazla bilgi** bağlantısına tıklayın
            2. **Yine de çalıştır** düğmesine tıklayın

            İndirdiğiniz dosyanın bozulmadığını doğrulamak için:

            ```powershell
            Get-FileHash .\${{ steps.sha.outputs.setupName }} -Algorithm SHA256
            ```

            Beklenen SHA256:

            ```
            ${{ steps.sha.outputs.sha256 }}
            ```

            Ayrıntılar: [docs/KURULUM.md](https://github.com/${{ github.repository }}/blob/main/docs/KURULUM.md)

      # Winget manifest PR'ı winget-pkgs deposuna elle açılır. Burada yalnızca
      # sürüm/URL/SHA256 alanları yamalanmış bir kopya artifact olarak sunulur.
      - name: Prepare Winget manifest
        working-directory: installer/winget
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.sha.outputs.setupName }}"
          foreach ($file in Get-ChildItem *.yaml) {
            (Get-Content $file.FullName) `
              -replace '(?<=^PackageVersion:\s).+', $version `
              -replace '(?<=InstallerUrl:\s).+', $url `
              -replace '(?<=InstallerSha256:\s)[0-9A-Fa-f]{64}', '${{ steps.sha.outputs.sha256 }}' `
              -replace '(?<=DisplayVersion:\s).+', $version `
              | Set-Content $file.FullName
          }
          Get-Content WinOptimizer.WinOptimizer.installer.yaml

      - name: Upload Winget manifest
        uses: actions/upload-artifact@v4
        with:
          name: winget-manifest
          path: installer/winget/*.yaml
